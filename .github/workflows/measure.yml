name: Measure

# The counted results of record for aarch64, and a cross-host check of the
# x86-64 ones. Manual: a full sweep takes hours.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Extra xtask arguments, e.g. --sets baseline,sonic-rs"
        required: false
        default: ""

jobs:
  count:
    name: Count (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: cargo xtask count --jobs 4 ${{ inputs.filter }}
      - run: cargo xtask e2e-count ${{ inputs.filter }}
      - run: cargo xtask alloc ${{ inputs.filter }}
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: results/
