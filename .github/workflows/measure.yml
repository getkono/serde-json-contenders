name: Measure

# The counted results of record for aarch64, and a cross-host check of the
# x86-64 ones. Manual: a full sweep takes hours.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Extra xtask arguments, e.g. --sets baseline,sonic-rs"
        required: false
        default: ""

jobs:
  # Every build must run the path it claims on these runners before anything
  # is measured on them: a failed doctor refuses the run.
  doctor:
    name: doctor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: cargo xtask doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-doctor-${{ matrix.os }}
          path: results/

  # One job per task: each writes its own result file, builds its own targets
  # and needs its own share of the runner's disk, so a runner lost in one task
  # loses only that task's results. Conformance runs here too, so aarch64's
  # variants are gated as x86-64's are, not only its portable build in CI.
  measure:
    name: ${{ matrix.task }} (${{ matrix.os }})
    needs: doctor
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        task: [count, e2e-count, alloc, conformance]
        include:
          - task: count
            args: --jobs 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Runner resources
        run: |
          echo "cores $(nproc), core file limit $(ulimit -c)"
          free -m
          df -h "$GITHUB_WORKSPACE"
      - name: cargo xtask ${{ matrix.task }}
        run: |
          # Memory and disk, sampled into this log: a runner that dies of
          # either leaves no other record of which it was.
          ( while sleep 300; do
              echo "resources $(date -u +%T): memory $(free -m | awk '/^Mem/ {print $3 "/" $2}') MiB, disk $(df -h --output=used,avail "$GITHUB_WORKSPACE" | tail -1 | xargs) used/avail"
            done ) &
          sampler=$!
          trap 'kill $sampler' EXIT
          cargo xtask ${{ matrix.task }} ${{ matrix.args }} ${{ inputs.filter }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.task }}-${{ matrix.os }}
          path: results/
