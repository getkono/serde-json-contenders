[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkono/serde-json-contenders"
publish = false

# Every candidate is pinned exactly. A result is a claim about a version, and a
# range would let `cargo update` change what the claim is about.
[workspace.dependencies]
payloads = { path = "crates/payloads" }
codecs = { path = "crates/codecs" }
alloc-count = { path = "crates/alloc-count" }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sonic-rs = { version = "=0.5.10", default-features = false }
simd-json = "=0.18.1"
flexon = { version = "=0.4.8", default-features = false, features = ["serde", "std"] }
jiter = { version = "=0.17.0", default-features = false, features = ["serde"] }
hifijson = { version = "=0.5.0", features = ["serde"] }
struson = { version = "=0.7.2", features = ["serde"] }

bytes = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
naive_bytecount = "allow"
# Generated fixtures mirror real schemas and hash constants.
struct_excessive_bools = "allow"
similar_names = "allow"
unreadable_literal = "allow"
format_push_string = "allow"
cast_possible_wrap = "allow"

# The profile Kynos ships. Line tables only: they change no code generation and
# let callgrind resolve the symbol its collection is toggled on.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

# Tests only: the conformance harness decodes a million floats per backend,
# which takes minutes unoptimized. The dev profile, whose build time is a
# measurement, is left alone.
[profile.test]
opt-level = 2
