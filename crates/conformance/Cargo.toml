[package]
name = "conformance"
description = "Differential conformance of every compiled backend against serde_json in the same build."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Forwarded one-to-one to `codecs`, as in `cell`.
[features]
sonic-rs = ["codecs/sonic-rs"]
simd-json = ["codecs/simd-json"]
flexon-rt = ["codecs/flexon-rt"]
flexon-ct = ["codecs/flexon-ct"]
jiter = ["codecs/jiter"]
hifijson = ["codecs/hifijson"]
struson = ["codecs/struson"]
float-roundtrip = ["codecs/float-roundtrip"]
arbitrary-precision = ["codecs/arbitrary-precision"]

[dependencies]
bytes.workspace = true
codecs.workspace = true
hex.workspace = true
payloads.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Only to switch core dumps off in a depth probe that may overflow its stack.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
